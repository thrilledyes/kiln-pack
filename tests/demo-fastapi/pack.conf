# kiln-pack 打包配置 —— demo-fastapi 样例（推理服务 profile）
# 换一个推理框架时，通常只改这一个文件；engine/ 与 profiles/ 本身不动。

# 选择交付形态：serve = 常驻推理服务（起服 + 健康检查 + 接口验收）。
# 不写 PROFILE 时默认也是 serve，兼容旧配置。
PROFILE="serve"

# 产物标识
APP_NAME="demo-fastapi"
VERSION="1.0.0"

# 镜像底座。
#   RUNTIME_BASE：最终运行镜像的底座，越干净越好（无编译器）。
#   BUILDER_BASE：编译阶段的底座，需要能装 gcc/python-dev/Cython。
RUNTIME_BASE="python:3.11-slim-bookworm"
BUILDER_BASE="python:3.11-slim-bookworm"

# 源码目录（相对 pack.conf 所在目录）。整个目录会进编译阶段，
# 但只有编译产物 + 非保护文件会进最终镜像。
SRC_DIR="."

# 需要保护（编译成 .so、删掉明文）的 .py，相对 SRC_DIR 的 glob，空格或换行分隔。
# 注意：不要把包的 __init__.py 列进来（见教程“坑”一节）；这里 __init__.py 是空的。
PROTECT_GLOBS="
app/secret_logic.py
app/server.py
"

# 运行期依赖
PIP_REQUIREMENTS="requirements.txt"

# 起服命令（在最终镜像里执行）。模块路径指向编译后的 .so，import 方式不变。
START_CMD="python -m uvicorn app.server:app --host 0.0.0.0 --port 8000"

# 对外端口与健康检查
EXPOSE_PORT="8000"
HEALTHCHECK_CMD="python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3).status==200 else 1)\""

# 敏感常量：不再写死在源码里，改由运行时环境变量 KILN_SECRET_MARKER 注入。
# 下面这个值仅用于验收——verify.sh 用它起容器，并确认镜像/归档里 grep 不到它。
SECRET_MARKER="SECRET_MARKER_DO_NOT_LEAK_7f3a9c"

# 运行必需的环境变量（缺失时 launch.sh 拒绝起服），空格/换行分隔。
REQUIRED_ENV="KILN_SECRET_MARKER"

# 验收时注入给容器的 env（KEY=VALUE，空格分隔）。真实部署由运维提供，不随镜像发出。
VERIFY_ENV="KILN_SECRET_MARKER=${SECRET_MARKER}"

# 本项目特有、应视为“来源痕迹”的额外标记（除内置 github.com 外）。空格分隔。
# 例如自家 GitHub 账号/组织/仓库名，确保不随镜像元数据泄漏。
ORIGIN_MARKERS="thrilledyes"
