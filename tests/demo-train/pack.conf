# kiln-pack 打包配置 —— demo-train 样例（训练作业 profile）
# 换一个训练框架/项目时，通常只改这一个文件；engine/ 与 profiles/ 本身不动。

# 选择交付形态：train = 训练作业（起训 + 冒烟训练验收）。
PROFILE="train"

# 产物标识
APP_NAME="demo-train"
VERSION="1.0.0"

# 镜像底座。
#   RUNTIME_BASE：最终运行镜像的底座。真实 GPU 训练换成带 CUDA/ROCm/CANN 的框架镜像；
#                 这里用 slim + pip 装 CPU 版 torch，纯 CPU 即可跑通，便于无卡环境验收。
#   BUILDER_BASE：编译阶段底座，需要能装 gcc/python-dev/Cython（pack.sh 自动装）。
RUNTIME_BASE="python:3.11-slim-bookworm"
BUILDER_BASE="python:3.11-slim-bookworm"

# 源码目录（相对 pack.conf 所在目录）。
SRC_DIR="."

# 需要保护（编译成 .so、删明文）的 .py。只保护真正的 IP 模块：
# 模型结构 / 数据配方 / loss / 调度 / 单步逻辑都在 recipe.py。
# 入口 trainer/train.py 刻意留明文（见该文件说明：torchrun 重导入 + spawn 对编译入口不友好）。
# 不要把包的 __init__.py 列进来（compile_protect.py 会拒绝）。
PROTECT_GLOBS="trainer/recipe.py"

# 运行期依赖（builder 与 runtime 都会装；arm64/x86 的 linux 默认装的就是 CPU 版 torch）。
PIP_REQUIREMENTS="requirements.txt"

# --- 训练作业专属 ---
# 启动器：single = 直接起单进程；torchrun = 单机多进程（--standalone 自带 rendezvous）。
# demo 用 single 即可；代码 train.py 已兼容 torchrun（读 RANK/WORLD_SIZE，gloo 后端）。
LAUNCHER="single"
NPROC_PER_NODE="1"
# TORCHRUN_ARGS=""        # torchrun 额外参数（LAUNCHER=torchrun 时生效）

# 容器内产物目录（checkpoint/日志）。运行时用 -v 挂到宿主取回；验收会挂临时目录核对。
OUTPUT_DIR="/workspace/output"
# 验收期望落下的 checkpoint（相对 OUTPUT_DIR 的 glob）。
CKPT_GLOB="*.pt"

# 起训命令（在最终镜像里执行）。模块路径指向编译后的 trainer.recipe(.so)，import 方式不变。
START_CMD="python -m trainer.train --steps 50"

# 敏感常量：不写死在源码里，改由运行时环境变量 KILN_SECRET_MARKER 注入。
# 下面这个值仅用于验收——verify.sh 用它起作业，并确认镜像/归档里 grep 不到它。
SECRET_MARKER="TRAIN_SECRET_DO_NOT_LEAK_a1b2c3"

# 运行必需的环境变量（缺失时 launch.sh 拒绝起训），空格/换行分隔。
REQUIRED_ENV="KILN_SECRET_MARKER"

# 验收时注入给容器的 env（KEY=VALUE，空格分隔）。真实训练由运维提供，不随镜像发出。
VERIFY_ENV="KILN_SECRET_MARKER=${SECRET_MARKER}"

# 本项目特有、应视为“来源痕迹”的额外标记（除内置 github.com 外）。空格分隔。
ORIGIN_MARKERS="thrilledyes"

# 配置加密：on 时把 CONFIG_GLOBS 匹配的配置加密成 .enc，明文不进镜像，运行时只在内存里解密。
# 密钥不写在这里：打包和运行时都用环境变量 KILN_CONFIG_KEY（openssl rand -base64 32 生成）。
CONFIG_ENCRYPT="on"
CONFIG_GLOBS="configs/*.yaml"
# 配置明文里的一段特征字符串，验收用它逐层扫描镜像、日志和产物，确认明文没有泄漏。
CONFIG_MARKER="CONFIG_SECRET_DO_NOT_LEAK_d4e5f6"
